name: ci

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        env:
            RUSTUP_TOOLCHAIN: 1.98.0
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - name: Install minimum Rust toolchain
              run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
            - name: Run lint checks
              run: scripts/ci/lint.sh
            - name: Validate workflow syntax
              run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

    test:
        name: test (${{ matrix.rust }})
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                rust: ['1.98.0', 'stable']
        env:
            RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - name: Install Rust toolchain
              run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal
            - name: Run tests
              run: scripts/ci/test.sh

    stratum-compatibility:
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        env:
            GITSEER_BIN: ${{ github.workspace }}/target/debug/gitseer
            STRATUM_REQUIRE_GITSEER_INTEGRATION: '1'
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  repository: griwes/stratum.nvim
                  ref: main
                  path: .dependencies/stratum.nvim
            - name: Install stable Rust
              run: rustup update stable --no-self-update
            - name: Build Gitseer
              run: scripts/ci/build.sh
            - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
              with:
                  neovim: true
                  version: stable
            - name: Run Stratum against this Gitseer checkout
              working-directory: .dependencies/stratum.nvim
              run: scripts/ci/test.sh
