name: ci

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        env:
            RUSTUP_TOOLCHAIN: 1.98.0
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install minimum Rust toolchain
              run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
            - name: Run lint checks
              run: scripts/ci/lint.sh
            - name: Validate workflow syntax
              run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

    test:
        name: test (${{ matrix.rust }})
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                rust: ['1.98.0', 'stable']
        env:
            RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install Rust toolchain
              run: rustup toolchain install "${RUSTUP_TOOLCHAIN}" --profile minimal
            - name: Run tests
              run: scripts/ci/test.sh

    stratum-compatibility:
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        env:
            GITSEER_BIN: ${{ github.workspace }}/target/debug/gitseer
            STRATUM_REQUIRE_GITSEER_INTEGRATION: '1'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: griwes/stratum.nvim
                  ref: main
                  path: .dependencies/stratum.nvim
            - name: Install stable Rust
              run: rustup update stable --no-self-update
            - name: Build Gitseer
              run: scripts/ci/build.sh
            - name: Install Neovim
              run: scripts/ci/install-neovim.sh stable
            - name: Run Stratum against this Gitseer checkout
              working-directory: .dependencies/stratum.nvim
              run: scripts/ci/test.sh
