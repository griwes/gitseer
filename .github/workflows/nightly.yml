name: nightly

on:
    schedule:
        - cron: '17 8 * * *'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: nightly-release
    cancel-in-progress: false

jobs:
    publish:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        env:
            GH_TOKEN: ${{ github.token }}
            RUSTUP_TOOLCHAIN: 1.98.0
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install minimum Rust toolchain
              run: rustup toolchain install 1.98.0 --profile minimal
            - name: Build Linux amd64 binary
              run: cargo build --locked --release --target x86_64-unknown-linux-gnu
            - name: Package and verify binary
              run: |
                  install -Dm755 \
                      target/x86_64-unknown-linux-gnu/release/gitseer \
                      dist/gitseer-linux-amd64
                  dist/gitseer-linux-amd64 capabilities >/dev/null
                  cd dist
                  sha256sum gitseer-linux-amd64 >gitseer-linux-amd64.sha256
            - name: Update rolling nightly release
              run: |
                  if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" >/dev/null 2>&1; then
                      gh api \
                          --method PATCH \
                          "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
                          -f sha="${GITHUB_SHA}" \
                          -F force=true >/dev/null
                  else
                      gh api \
                          --method POST \
                          "repos/${GITHUB_REPOSITORY}/git/refs" \
                          -f ref='refs/tags/nightly' \
                          -f sha="${GITHUB_SHA}" >/dev/null
                  fi

                  printf '%s\n' \
                      'Automated Linux amd64 build from the current main branch.' \
                      '' \
                      "Commit: ${GITHUB_SHA}" >nightly-notes.md

                  if gh release view nightly >/dev/null 2>&1; then
                      gh release edit nightly \
                          --verify-tag \
                          --title 'Nightly' \
                          --notes-file nightly-notes.md \
                          --prerelease \
                          --latest=false
                  else
                      gh release create nightly \
                          --verify-tag \
                          --title 'Nightly' \
                          --notes-file nightly-notes.md \
                          --prerelease \
                          --latest=false
                  fi

                  gh release upload nightly \
                      dist/gitseer-linux-amd64 \
                      dist/gitseer-linux-amd64.sha256 \
                      --clobber
