[package]
name = "gitseer"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Single-repository Git state worker for editor and tooling integrations"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
git2 = "0.20"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
